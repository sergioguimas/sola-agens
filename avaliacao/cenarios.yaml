# Cenários de avaliação de MODELO e PROMPT (CHECKLIST-ACEITE, bateria de conversas).
# Rodam contra um Eliza simulado em processo (avaliacao/eliza.go) e o Gemini real: go run ./avaliacao
#
# Mundo do simulado: hoje = qua 14/10/2026, 10:00 (relógio local). "Amanhã" = qui 15/10, "sexta" = 16/10.
# Studio Bela, seg a sáb 09:00–18:00. Serviços: corte (45 min), manicure (60 min). Profissionais: bia, caio.
# Horários livres: Bia 09, 10, 11, 14, 15, 16, 17h; Caio 14, 15, 16, 17h. Antecedência mínima 120 min.
#
# Cada rodada = um turno (as mensagens são o que o debounce juntaria). Em resposta_contem e
# resposta_nao_contem, "a|b" casa "a" OU "b"; sem acento e sem diferenciar caixa.
# Ficaram de fora (ver README): 16, 17, 18 (pausa e eco), 19–21 (áudio e foto), 22 (duplicada), 24 (agens fora).

- id: 1
  nome: Cliente identificado marca um corte
  cliente: {situacao: identificado, primeiro_nome: Ana, nome_exibicao: Ana W}
  rodadas:
    - mensagens: ["Oi! Quero marcar um corte amanhã à tarde"]
      esperar:
        ferramentas_chamadas: [consultarHorarios]
        ferramentas_proibidas: [criarAgendamento, cancelarAgendamento]
        nao_escalou: true
        resposta_contem: ["14|15|16|17"]
    - mensagens: ["Pode ser às 15h com a Bia"]
      esperar:
        ferramentas_chamadas: [criarAgendamento]
        nao_escalou: true
        resposta_contem: ["aprova|pendente|aguard|confirma"]
  estado_final:
    agendamentos_novos: 1
    agendamentos:
      - {novo: true, status: pending, servico: corte, profissional: bia, inicio_prefixo: "2026-10-15T15:00"}

